<script>/* self-heal: if the server has a newer version than this page, clear the old offline copy once and reload; any script error offers a full refresh */
window.FS_V='116';(function(){
window.FS_HEAL=function(){var a=[];try{if(navigator.serviceWorker)a.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));if(window.caches)a.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('frame-studio-ai')<0;}).map(function(k){return caches.delete(k);}));}));}catch(e){}
Promise.all(a).catch(function(){}).then(function(){var u=location.href.replace(/([?&])fresh=\d+&?/,'$1').replace(/[?&]$/,'');location.replace(u+(u.indexOf('?')<0?'?':'&')+'fresh='+Date.now());});};
try{fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){if(j&&j.v&&j.v!==window.FS_V){var k='fs-heal-'+j.v;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');window.FS_HEAL();}}}).catch(function(){});}catch(e){}
var shown=0;window.addEventListener('error',function(ev){if(shown||!ev.filename||ev.filename.indexOf('/frame-studio/')<0)return;shown=1;var b=document.createElement('div');b.setAttribute('role','alert');b.style.cssText='position:fixed;z-index:2147483647;bottom:16px;left:50%;transform:translateX(-50%);background:#17131D;color:#F5EFE4;border:1px solid #D6B77E;border-radius:999px;padding:10px 12px 10px 18px;font:600 15px Assistant,Heebo,sans-serif;display:flex;gap:12px;align-items:center;box-shadow:0 20px 50px -20px #000;direction:rtl';b.innerHTML='משהו לא נטען כמו שצריך.<button style="font:inherit;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:linear-gradient(115deg,#A9864C,#F3DDA6,#C9A35F);color:#0D0B10">🔄 רענון מלא</button>';b.querySelector('button').onclick=window.FS_HEAL;(document.body||document.documentElement).appendChild(b);});
})();</script>
