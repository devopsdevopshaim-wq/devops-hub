<body class="adm-body">
<header class="dz-top">
  <a class="dz-brand" href="./"><span class="mark" aria-hidden="true">⚙️</span><span><b data-biz="name">פריים מגנטים</b><small>ניהול האתר</small></span></a>
  <nav class="dz-nav" hidden><span class="adm-who" id="who"></span><span class="adm-state" id="state"></span><button class="btn line small" id="preview-btn">👁 תצוגה מקדימה</button><button class="btn line small" id="save">💾 שמירה</button><button class="btn gold small" id="publish" disabled>🌐 פרסום באתר</button><button class="btn line small" id="logout-top" title="יציאה">⏏</button></nav>
</header>

<section class="adm-login" id="login" hidden>
  <div class="card">
    <h1>🔐 כניסת מנהל</h1>
    <p>נכנסים עם המייל והסיסמה שלך. בפעם הראשונה, או אם שכחת: "שכחתי סיסמה" שולח סיסמה ראשונית למייל, ובכניסה בוחרים סיסמה קבועה.</p>
    <div id="acc-box"></div>
    <p class="hint">🛡️ הכניסה מאובטחת בשרת: סיסמאות נשמרות רק כגיבוב, ניסיונות חוזרים ננעלים, וכל פעולה נבדקת מול הכניסה שלך.</p>
  </div>
</section>

<main class="adm" id="app" hidden>
  <nav class="adm-side" id="side" aria-label="ניהול"></nav>
  <section class="adm-main" id="main" aria-live="polite"></section>
  <aside class="adm-preview" id="pv" hidden><div class="adm-pv-bar"><b>תצוגה מקדימה (לפני פרסום)</b><button class="btn small line" id="pv-x">✕</button></div><iframe id="pv-frame" title="תצוגה מקדימה של האתר"></iframe></aside>
</main>
<div class="dz-busy" id="busy" hidden><div><i></i><span id="busy-msg"></span></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="print-area" class="print-area" aria-hidden="true"></div>
