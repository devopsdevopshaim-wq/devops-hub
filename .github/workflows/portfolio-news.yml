name: Portfolio news

# Refreshes the headlines on the portfolio (portfolio/news.json on gh-pages)
# every two hours, straight on the published branch, so main stays quiet.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh headlines on gh-pages
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          [ -d /tmp/pages/portfolio ] || { echo "portfolio is not published yet"; exit 0; }
          node .github/scripts/portfolio-news.mjs /tmp/pages/portfolio/news.json
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "portfolio: headlines $(date -u +%H:%M)"
          git push -q origin gh-pages
