name: Deploy agents to n8n Cloud

# Installs SPIDER's three n8n workflows (agents, leads & prices, sign-in) in n8n
# Cloud through the n8n API, with their credentials, activates them and checks
# that they answer. Repository secrets: N8N_URL, N8N_API_KEY, GMAIL_APP_PASSWORD,
# and ANTHROPIC_API_KEY until a Claude credential exists. See n8n/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['n8n/hasadna-*.json', '.github/scripts/n8n-deploy.mjs']

permissions:
  contents: write
  actions: write

concurrency:
  group: n8n-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install in n8n Cloud
        id: deploy
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAIM_WEB_KEY: ${{ secrets.HAIM_WEB_KEY }}
          SPIDER: ${{ secrets.SPIDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: node .github/scripts/n8n-deploy.mjs
      - name: Connect the portfolio
        if: steps.deploy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/projects.json
          git commit -q -m "portfolio: connect Maya and the control center to n8n"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # pushes made with GITHUB_TOKEN do not start other workflows
          gh workflow run vacation-hub-pages.yml --ref main
