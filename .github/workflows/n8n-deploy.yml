name: Deploy agents to n8n Cloud

# Installs SPIDER's n8n workflows (agents, leads & prices, sign-in, Maya's voice) in n8n
# Cloud through the n8n API, with their credentials, activates them and checks
# that they answer. Repository secrets: N8N_URL, N8N_API_KEY, GMAIL_APP_PASSWORD,
# and ANTHROPIC_API_KEY until a Claude credential exists. See n8n/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['n8n/hasadna-*.json', 'n8n/snippets/**', 'n8n/test/**', '.github/scripts/n8n-deploy.mjs', '.github/workflows/n8n-deploy.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: n8n-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Security tests (a failure stops the install)
        run: |
          node n8n/test/run-all.mjs
          # the committed workflow files must be exactly what the builders produce
          python3 n8n/build-access-workflow.py && python3 n8n/build-business-workflow.py && python3 n8n/build-multi-agent-workflow.py && python3 n8n/build-voice-workflow.py
          git diff --exit-code -- n8n/*.json || { echo '::error::n8n/*.json is out of date with its builder. Run the build-*.py scripts and commit.'; exit 1; }
      - name: Install in n8n Cloud
        id: deploy
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAIM_WEB_KEY: ${{ secrets.HAIM_WEB_KEY }}
          SPIDER: ${{ secrets.SPIDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ADMIN_TOTP_SECRET: ${{ secrets.ADMIN_TOTP_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MORNING_CLIENT_ID: ${{ secrets.MORNING_CLIENT_ID }}
          MORNING_CLIENT_SECRET: ${{ secrets.MORNING_CLIENT_SECRET }}
        run: node .github/scripts/n8n-deploy.mjs
      - name: Connect the portfolio
        if: steps.deploy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/projects.json
          git commit -q -m "portfolio: connect Maya and the control center to n8n"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # pushes made with GITHUB_TOKEN do not start other workflows
          gh workflow run vacation-hub-pages.yml --ref main
