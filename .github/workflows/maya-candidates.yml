# One-off: asks Cloudflare Workers AI (flux-1-schnell) for half-body portraits of a professional assistant and pushes them to the branch maya-candidates.
name: Maya candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate
        env:
          SPIDER: ${{ secrets.SPIDER }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node .github/scripts/maya-candidates.mjs
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b maya-candidates
          git add portfolio/img/candidates
          git commit -m "Maya candidates" || { echo nothing; exit 0; }
          git push -f origin maya-candidates
