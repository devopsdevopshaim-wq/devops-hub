# One-off: LiveAvatar LITE mode docs.
name: LiveAvatar docs
on: workflow_dispatch
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        run: |
          for p in docs/lite-mode/overview docs/lite-mode/lifecycle docs/lite-mode/configuration docs/lite-mode/events; do
            echo "##### $p"; curl -sL "https://docs.liveavatar.com/$p.md" | head -c 9000; echo
          done
          echo "##### sdk"; curl -sL https://api.github.com/repos/heygen-com/liveavatar-web-sdk/contents | head -c 1500
