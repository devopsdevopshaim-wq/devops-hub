# One-off diagnostic: read HeyGen's current live-avatar docs.
name: HeyGen check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the docs
        run: |
          curl -sL https://developers.heygen.com/live-avatar.md | head -c 6000
          echo; echo "=========== liveavatar llms"
          curl -sL https://docs.liveavatar.com/llms.txt | head -c 7000
