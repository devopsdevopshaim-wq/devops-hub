name: Portfolio screenshots

# Captures every project in portfolio/projects.json and commits the images to
# portfolio/shots/. Runs by hand (optionally for some projects only) and after
# projects.json changes on main.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Project ids separated by spaces (empty = all)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['portfolio/projects.json']

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-shots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Take screenshots
        env:
          NODE_PATH: /tmp/pw/node_modules
          IDS: ${{ github.event.inputs.ids }}
        run: |
          cp .github/scripts/portfolio-shots.mjs /tmp/pw/shots.mjs
          node /tmp/pw/shots.mjs $IDS
        working-directory: ${{ github.workspace }}
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/shots
          if git diff --cached --quiet; then echo "no new screenshots"; exit 0; fi
          git commit -q -m "portfolio: update screenshots"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # pushes made with GITHUB_TOKEN do not start other workflows, so ask for the deploy
          gh workflow run vacation-hub-pages.yml --ref main
