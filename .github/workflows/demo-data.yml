# One-off: real Hebcal and Sefaria answers for the site demo film (so the film shows true data, not invented text).
name: Demo data
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def get(u):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'demo-data'}), timeout=25))
              except Exception as e:
                  return {'error': str(e)}
          out = {}
          out['shabbat'] = get('https://www.hebcal.com/shabbat?cfg=json&geonameid=281184&b=40&M=on&lg=he')
          out['zmanim'] = get('https://www.hebcal.com/zmanim?cfg=json&geonameid=281184&date=2026-10-28')
          out['daf'] = get('https://www.hebcal.com/hebcal?v=1&cfg=json&F=on&lg=he&start=2026-10-28&end=2026-10-28')
          parsha = next((i for i in out['shabbat'].get('items', []) if i.get('category') == 'parashat'), {})
          ref = (parsha.get('leyning') or {}).get('torah', 'Genesis 12:1-17:27')
          book, start = ref.split(' ')[0], ref.split(' ')[1].split('-')[0]
          verse = book + ' ' + start
          names = ['Rashi on ', 'Ramban on ', 'Ibn Ezra on ', 'Sforno on ', 'Or HaChaim on ', 'Kli Yakar on ', 'Rashbam on ', 'Chizkuni, ', 'Baal HaTurim on ', 'Rabbeinu Bahya, ']
          out['verse'] = verse
          out['comm'] = {}
          for n in names:
              r = n + (verse.replace('Genesis', 'Bereshit') if 'Bahya' in n else verse)
              out['comm'][n] = get('https://www.sefaria.org/api/v3/texts/' + urllib.parse.quote(r) + '?version=hebrew')
          out['related'] = get('https://www.sefaria.org/api/related/' + urllib.parse.quote(book + '.' + start.replace(':', '.')))
          tal = [l for l in out['related'].get('links', []) if l.get('category') == 'Talmud'][:6]
          out['talmud'] = []
          for l in tal:
              ref = l.get('sourceRef') or l.get('ref')
              out['talmud'].append({'ref': ref, 'he': l.get('sourceHeRef'), 'text': get('https://www.sefaria.org/api/v3/texts/' + urllib.parse.quote(ref) + '?version=hebrew')})
          out['related'] = {'n': len(out['related'].get('links', []))}
          print('==JSON==' + json.dumps(out, ensure_ascii=False) + '==END==')
          PY
