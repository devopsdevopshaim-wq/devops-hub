name: Portfolio radio

# Finds working internet radio stations for the site's music player and
# publishes portfolio/radio.json on gh-pages. Every station is played for a
# moment before it is kept. Runs daily (stations come and go) and on demand.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-radio
  cancel-in-progress: true

jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check stations and publish
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          [ -d /tmp/pages/portfolio ] || { echo "portfolio is not published yet"; exit 0; }
          node .github/scripts/portfolio-radio.mjs /tmp/pages/portfolio/radio.json
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/radio.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "portfolio: radio stations $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break || sleep 5; done
