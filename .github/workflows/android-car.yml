name: Android car app

# Builds the SPIDER car app (a media app that Android Auto lists with the car's apps) and publishes the APK on the site:
# https://devopsdevopshaim-wq.github.io/devops-hub/portfolio/downloads/spider-car.apk

on:
  push:
    branches: [main]
    paths: ['android-car/**', '.github/workflows/android-car.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-car
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        working-directory: android-car
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spider-car-apk
          path: android-car/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish on the site
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          [ -d /tmp/pages/portfolio ] || { echo "portfolio is not published yet"; exit 0; }
          mkdir -p /tmp/pages/portfolio/downloads
          cp android-car/app/build/outputs/apk/debug/app-debug.apk /tmp/pages/portfolio/downloads/spider-car.apk
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/downloads/spider-car.apk
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "portfolio: car app APK"
          for i in 1 2 3; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break || sleep 5; done
