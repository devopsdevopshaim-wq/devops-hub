name: Fetch dig game 3D assets

# One-off: downloads free (CC0) textures, skies and models from Poly Haven into
# dig-game/assets/_incoming on the branch that changed the fetch script.

on:
  push:
    branches-ignore: [main]   # downloads land on the work branch, never on main
    paths: ['.github/scripts/dig-assets.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/dig-assets.py
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dig-game/assets
          git diff --cached --quiet || git commit -m "dig-game: assets from Poly Haven (CC0)"
          git push
