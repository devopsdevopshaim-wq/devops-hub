name: Deploy vacation-hub to GitHub Pages

# GitHub Pages is served from the gh-pages branch.
# Every change to vacation-hub/ on main is copied there automatically.
# book-studio/ is published under /book-studio/, interior-hub/ under /interior/,
# electro-fix/ under /electro-fix/, assembly-studio/ under /assembly-studio/
# netplan/ under /netplan/, automation/ under /automation/, robotic-parking/ under /robotic-parking/,
# comic-studio/ under /comic-studio/, portfolio/ under /portfolio/, and finance-hub/, marketing-hub/,
# aia-studio/, wellness-hub/, torah-hub/ each under their own matching path (magnet-studio
# standalone sites — HTML only, CSS/JS loaded live from hapinkas-hayomi.onrender.com).
# Sub-sites already on gh-pages are kept when this run's checkout does not have
# them, so a run from one branch does not wipe a site published from another.

on:
  push:
    branches: [main]
    paths: ['vacation-hub/**', 'interior-hub/**', 'n8n/**', 'book-studio/**', 'electro-fix/**', 'assembly-studio/**', 'netplan/**', 'automation/**', 'robotic-parking/**', 'comic-studio/**', 'portfolio/**', 'finance-hub/**', 'marketing-hub/**', 'aia-studio/**', 'wellness-hub/**', 'torah-hub/**']
  schedule:
    - cron: '17 3 * * *'   # daily: skills and knowledge are rebuilt from the projects as they are now
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacation-hub-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api/knowledge.json (read by the n8n agent)
        run: node n8n/build-knowledge.mjs vacation-hub
      - name: Build portfolio/knowledge.json (read by Guy's n8n agent)
        run: node .github/scripts/portfolio-knowledge.mjs /tmp/portfolio-clones || echo "knowledge build failed; publishing without it"
      - name: Build a Claude skill for every project (portfolio/skills)
        run: node .github/scripts/portfolio-skills.mjs portfolio/skills || echo "skills build failed; publishing without them"
      - name: Publish vacation-hub to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r vacation-hub/. /tmp/site/
          rm -f /tmp/site/README.md
          if [ -d interior-hub ]; then
            mkdir -p /tmp/site/interior
            cp -r interior-hub/. /tmp/site/interior/
            rm -f /tmp/site/interior/README.md
          fi
          if [ -d book-studio ]; then
            mkdir -p /tmp/site/book-studio
            cp -r book-studio/index.html book-studio/css book-studio/js /tmp/site/book-studio/
          fi
          if [ -d electro-fix ]; then
            mkdir -p /tmp/site/electro-fix
            cp -r electro-fix/index.html electro-fix/css electro-fix/js electro-fix/vendor /tmp/site/electro-fix/
          fi
          if [ -d assembly-studio ]; then
            mkdir -p /tmp/site/assembly-studio
            cp -r assembly-studio/index.html assembly-studio/css assembly-studio/js /tmp/site/assembly-studio/
          fi
          if [ -d netplan ]; then
            mkdir -p /tmp/site/netplan
            cp -r netplan/index.html netplan/css netplan/js /tmp/site/netplan/
          fi
          if [ -d automation ]; then
            mkdir -p /tmp/site/automation
            cp -r automation/index.html automation/css automation/js /tmp/site/automation/
          fi
          if [ -d robotic-parking ]; then
            mkdir -p /tmp/site/robotic-parking
            cp robotic-parking/index.html /tmp/site/robotic-parking/
            cp robotic-parking/site.json /tmp/site/robotic-parking/ 2>/dev/null || true
            cp -r robotic-parking/img robotic-parking/gallery /tmp/site/robotic-parking/ 2>/dev/null || true
          fi
          if [ -d comic-studio ]; then
            mkdir -p /tmp/site/comic-studio
            cp -r comic-studio/index.html comic-studio/css comic-studio/js /tmp/site/comic-studio/
          fi
          if [ -d portfolio ]; then
            mkdir -p /tmp/site/portfolio
            cp -r portfolio/. /tmp/site/portfolio/
            # tooling and docs stay in the repo only
            rm -rf /tmp/site/portfolio/README.md /tmp/site/portfolio/upload-projects.ps1 /tmp/site/portfolio/guide-server
          fi
          # the standalone sites carry their own css, js, data and runtime (tools/build-hubs.mjs); nothing is loaded from another server
          if [ -d finance-hub ]; then
            mkdir -p /tmp/site/finance-hub
            cp -r finance-hub/. /tmp/site/finance-hub/
          fi
          if [ -d marketing-hub ]; then
            mkdir -p /tmp/site/marketing-hub
            cp -r marketing-hub/. /tmp/site/marketing-hub/
          fi
          if [ -d aia-studio ]; then
            mkdir -p /tmp/site/aia-studio
            cp -r aia-studio/. /tmp/site/aia-studio/
          fi
          if [ -d wellness-hub ]; then
            mkdir -p /tmp/site/wellness-hub
            cp -r wellness-hub/. /tmp/site/wellness-hub/
          fi
          if [ -d torah-hub ]; then
            mkdir -p /tmp/site/torah-hub
            cp -r torah-hub/. /tmp/site/torah-hub/
          fi
          # keep sub-sites published earlier that this checkout does not contain
          if git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/old 2>/dev/null; then
            for d in interior book-studio electro-fix assembly-studio netplan automation robotic-parking comic-studio portfolio finance-hub marketing-hub aia-studio wellness-hub torah-hub; do
              if [ ! -d "/tmp/site/$d" ] && [ -d "/tmp/old/$d" ]; then cp -r "/tmp/old/$d" /tmp/site/; fi
            done
          fi
          # headlines: start from the last published ones, then refresh
          if [ -d /tmp/site/portfolio ]; then
            [ -f /tmp/old/portfolio/news.json ] && cp /tmp/old/portfolio/news.json /tmp/site/portfolio/news.json
            # radio stations are checked by portfolio-radio.yml; keep the last good list
            [ -f /tmp/old/portfolio/radio.json ] && cp /tmp/old/portfolio/radio.json /tmp/site/portfolio/radio.json
            node .github/scripts/portfolio-news.mjs /tmp/site/portfolio/news.json || echo "news refresh failed; keeping the last headlines"
          fi
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish vacation-hub from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
