name: Deploy vacation-hub to GitHub Pages

# GitHub Pages is served from the gh-pages branch.
# Every change to vacation-hub/ on main is copied there automatically.

on:
  push:
    branches: [main]
    paths: ['vacation-hub/**', 'interior-hub/**', 'n8n/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacation-hub-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api/knowledge.json (read by the n8n agent)
        run: node n8n/build-knowledge.mjs vacation-hub
      - name: Publish vacation-hub to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r vacation-hub/. /tmp/site/
          rm -f /tmp/site/README.md
          # the interior design planner is served under /interior/
          mkdir -p /tmp/site/interior
          cp -r interior-hub/. /tmp/site/interior/
          rm -f /tmp/site/interior/README.md
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish vacation-hub from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
