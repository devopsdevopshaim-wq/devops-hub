name: ai-video-stack

on:
  push:
    paths: ["ai-video-stack/**", ".github/workflows/ai-video-stack.yml"]
  pull_request:
    paths: ["ai-video-stack/**", ".github/workflows/ai-video-stack.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-video-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gateway tests
        working-directory: ai-video-stack/gateway
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: n8n workflow is up to date
        run: |
          python n8n/build_workflow.py
          git diff --exit-code n8n/workflows/
      - name: Shell scripts parse
        run: bash -n scripts/*.sh comfyui/entrypoint.sh
      - name: docker compose config is valid
        run: docker compose config -q
      - name: Gateway image builds
        run: docker build -t ai-video-gateway gateway
