name: Deploy sign-in server to Cloudflare

# The sign-in server runs on Cloudflare Workers (free plan, no monthly execution cap): cloudflare/. It needs two secrets:
# CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Without them this workflow does nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'n8n/snippets/access-handle.js', 'n8n/snippets/security.js', 'n8n/hasadna-access.json', '.github/scripts/cloudflare-deploy.mjs', '.github/workflows/cloudflare-deploy.yml']

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find the Cloudflare token
        id: have
        env:
          CLOUDFLARE: ${{ secrets.CLOUDFLARE }}
          SPIDER: ${{ secrets.SPIDER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node .github/scripts/cloudflare-secrets.mjs
          if [ "$(grep -c '^go=true' "$GITHUB_OUTPUT")" = "0" ]; then echo "::notice::No Cloudflare token (CLOUDFLARE_API_TOKEN, or a CLOUDFLARE secret); nothing to deploy"; fi
      - name: Build and test (a failure stops the deploy)
        if: steps.have.outputs.go == 'true'
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          node build.mjs
          printf 'ADMIN_PASSWORD_HASH=%s\nSHARED_KEY=test-shared-key\n' "$(node test/hash.mjs 'Test-Passw0rd-xyz')" > .dev.vars
          (npx wrangler dev --local --port 8787 > /tmp/wrangler-dev.log 2>&1 &)
          for i in $(seq 1 40); do curl -s localhost:8787/ >/dev/null && break; sleep 1; done
          WORKER_URL=http://localhost:8787 node test/worker.test.mjs
          rm -f .dev.vars
      - name: Deploy
        if: steps.have.outputs.go == 'true'
        env:
          SPIDER: ${{ secrets.SPIDER }}
          HAIM_WEB_KEY: ${{ secrets.HAIM_WEB_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOTP_SECRET: ${{ secrets.ADMIN_TOTP_SECRET }}
          MORNING_CLIENT_ID: ${{ secrets.MORNING_CLIENT_ID }}
          MORNING_CLIENT_SECRET: ${{ secrets.MORNING_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node .github/scripts/cloudflare-deploy.mjs
      - name: Point the site at the Worker
        if: steps.have.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/api.json
          if git diff --cached --quiet -- portfolio/api.json; then echo "api.json unchanged"; exit 0; fi
          git commit -q -m "portfolio: the sign-in server is now on Cloudflare"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # a push made with GITHUB_TOKEN starts no other workflow, so publish the site explicitly
          gh workflow run vacation-hub-pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
