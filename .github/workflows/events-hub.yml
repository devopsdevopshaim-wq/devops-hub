name: events-hub tests

on:
  push:
    paths: ['events-hub/**', '.github/workflows/events-hub.yml']
  pull_request:
    paths: ['events-hub/**', '.github/workflows/events-hub.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: events-hub/package-lock.json
      - run: npm ci
      - run: npm test
