name: Deploy Regaim (events-hub) server to Cloudflare

# אפליקציית רגעים: האתר מתפרסם ב-GitHub Pages (vacation-hub-pages.yml, תחת /events-hub/),
# והשרת שלה נפרס מכאן ל-Cloudflare Workers בשם regaim-events - שרת נפרד משרת הכניסה (spider-auth).
# משתמש באותו טוקן Cloudflare של שרת הכניסה (CLOUDFLARE_API_TOKEN, או הסוד CLOUDFLARE / SPIDER).
# סודות של האפליקציה (Settings → Secrets and variables → Actions):
#   סיסמת אפליקציית הניהול = ADMIN_PASSWORD (אותה סיסמה של אתר הניהול הקיים), או EVENTS_ADMIN_PASSWORD לסיסמה נפרדת;
#   EVENTS_REMOVE_BG_API_KEY,
#   EVENTS_PAYMENT_PROVIDER / EVENTS_PAYMENT_TERMINAL / EVENTS_PAYMENT_API_KEY / EVENTS_PAYMENT_API_SECRET
on:
  push:
    branches: [main]
    paths: ['events-hub/src/**', 'events-hub/wrangler.toml', 'events-hub/package.json', 'events-hub/package-lock.json', 'events-hub/test/**', '.github/workflows/events-hub-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: events-hub/package-lock.json
      - name: Find the Cloudflare token
        id: have
        working-directory: .
        env:
          CLOUDFLARE: ${{ secrets.CLOUDFLARE }}
          SPIDER: ${{ secrets.SPIDER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node .github/scripts/cloudflare-secrets.mjs
          if [ "$(grep -c '^go=true' "$GITHUB_OUTPUT")" = "0" ]; then echo "::warning::No Cloudflare token (CLOUDFLARE_API_TOKEN, or a CLOUDFLARE secret); the Regaim server was not deployed"; fi
      - name: Test (a failure stops the deploy)
        run: |
          npm ci --no-audit --no-fund
          npm test
          printf 'ADMIN_PASSWORD=smoke-test-pass\n' > .dev.vars
          (npx wrangler dev --local --port 8787 > /tmp/wrangler-dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -s localhost:8787/api/config >/dev/null && break; sleep 1; done
          WORKER_URL=http://localhost:8787 ADMIN_PASSWORD=smoke-test-pass node test/worker-smoke.mjs || { tail -40 /tmp/wrangler-dev.log; exit 1; }
          rm -f .dev.vars
      - name: Deploy
        if: steps.have.outputs.go == 'true'
        env:
          # אותה סיסמה של אתר הניהול הקיים (ADMIN_PASSWORD), אלא אם הוגדרה סיסמה נפרדת לרגעים
          EVENTS_ADMIN_PASSWORD: ${{ secrets.EVENTS_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          EVENTS_REMOVE_BG_API_KEY: ${{ secrets.EVENTS_REMOVE_BG_API_KEY }}
          EVENTS_PAYMENT_PROVIDER: ${{ secrets.EVENTS_PAYMENT_PROVIDER }}
          EVENTS_PAYMENT_TERMINAL: ${{ secrets.EVENTS_PAYMENT_TERMINAL }}
          EVENTS_PAYMENT_API_KEY: ${{ secrets.EVENTS_PAYMENT_API_KEY }}
          EVENTS_PAYMENT_API_SECRET: ${{ secrets.EVENTS_PAYMENT_API_SECRET }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          # הסודות: רק מה שהוגדר ב-GitHub עובר ל-Cloudflare
          node -e '
            const m = { ADMIN_PASSWORD: "EVENTS_ADMIN_PASSWORD", REMOVE_BG_API_KEY: "EVENTS_REMOVE_BG_API_KEY", PAYMENT_PROVIDER: "EVENTS_PAYMENT_PROVIDER",
              PAYMENT_TERMINAL: "EVENTS_PAYMENT_TERMINAL", PAYMENT_API_KEY: "EVENTS_PAYMENT_API_KEY", PAYMENT_API_SECRET: "EVENTS_PAYMENT_API_SECRET" };
            const out = {}; for (const [k, v] of Object.entries(m)) if (process.env[v]) out[k] = process.env[v];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("secrets to set:", Object.keys(out).join(", ") || "none");'
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json
          URL=$(grep -oE 'https://regaim-events\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)
          EXPECTED=$(grep -oE "API_CLOUD = '[^']+'" public/js/common.js | cut -d"'" -f2)
          echo "server: $URL (the site uses: $EXPECTED)"
          if [ -n "$URL" ] && [ "$URL" != "$EXPECTED" ]; then
            echo "::error::The server is at $URL but events-hub/public/js/common.js (API_CLOUD) says $EXPECTED. Change API_CLOUD to $URL."
            exit 1
          fi
          for i in $(seq 1 30); do curl -sf "$URL/api/config" >/dev/null && break; sleep 5; done
          curl -sf "$URL/api/config" >/dev/null && echo "server answers ✓"
          {
            echo "### רגעים: השרת נפרס ✓"
            echo "- אפליקציית הלקוח: https://devopsdevopshaim-wq.github.io/devops-hub/events-hub/"
            echo "- אפליקציית הניהול: https://devopsdevopshaim-wq.github.io/devops-hub/events-hub/admin/"
            echo "- השרת: $URL"
            if [ -z "$EVENTS_ADMIN_PASSWORD" ]; then echo "- ⚠️ אין סיסמת מנהל (ADMIN_PASSWORD או EVENTS_ADMIN_PASSWORD): בלעדיה אי אפשר להיכנס לאפליקציית הניהול."; fi
          } >> "$GITHUB_STEP_SUMMARY"
