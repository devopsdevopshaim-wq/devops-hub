name: GFPGAN test
on:
  workflow_dispatch:
  push:
    branches: [ccr-eb804aa8-aja6m4]
    paths: [.github/workflows/gfpgan-test.yml, .github/scripts/gfpgan-test.cjs, frame-studio/js/ai-restore.js]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Restore faces in the studio page
        run: |
          (python3 -m http.server 8099 > /dev/null 2>&1 &) ; sleep 2
          node .github/scripts/gfpgan-test.cjs
      - name: Keep the pictures on the ci-gfpgan branch
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          git config --global user.name ci && git config --global user.email ci@users.noreply.github.com
          git init -q && git checkout -q -b ci-gfpgan && git add -A && git commit -qm "GFPGAN test" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-gfpgan
