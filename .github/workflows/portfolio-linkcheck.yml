name: Portfolio link check

# Opens every project's address from a GitHub runner and prints which ones do not answer. On demand only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/portfolio-linkcheck.mjs
