# פריסה אוטומטית מ-GitHub ל-Render (https://render.com)
# ב-Render: New → Blueprint → בחירת הריפו הזה. כל דחיפה לענף הראשי תעדכן את האפליקציה.
services:
  - type: web
    name: regaim-events-hub
    runtime: node
    rootDir: events-hub
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        sync: false # כתובת האתר, למשל https://regaim-events-hub.onrender.com
      - key: ADMIN_PASSWORD
        sync: false # סיסמת המנהל - תתבקש להזין בהקמה
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: REMOVE_BG_API_KEY
        sync: false
    # דיסק קבוע לשמירת הנתונים והתמונות (דורש תוכנית בתשלום ב-Render)
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
