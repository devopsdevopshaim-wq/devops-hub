<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5476b">
  <meta name="description" content="מגנטים, בלוקים, מסגרות, חבילות ומתנות לאירועים">
  <title>רגעים - מזכרות לאירועים</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="רגעים">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/"><span class="logo">📸</span><span id="brand-name">רגעים</span></a>
      <span class="spacer"></span>
      <button class="btn soft sm hidden hide-sm" data-install>📲 התקנה</button>
      <button class="icon-btn" id="cart-btn" aria-label="סל קניות">🛒<span class="count-dot hidden" id="cart-count">0</span></button>
    </div>
    <div class="wrap hide-sm" style="padding-top:0">
      <nav class="tabs" id="nav">
        <button class="tab active" data-view="store">🛍️ חנות</button>
        <button class="tab" data-view="events">📸 האירועים שלי</button>
        <button class="tab" data-view="orders">📦 ההזמנות שלי</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="view-store">
      <div id="collections"></div>
      <div class="tabs" id="cat-tabs" style="margin:12px 0"></div>
      <div class="grid" id="products"></div>
    </section>

    <section id="view-events" class="hidden">
      <div class="card">
        <h2>האירועים שלי</h2>
        <p class="muted">כאן נשמרים האירועים שבהם סרקתם QR. אפשר לחזור לתמונות בכל זמן ולהזמין מהן מוצרים.</p>
        <div id="events-list" class="stack"></div>
        <button class="btn soft hidden" data-install style="margin-top:12px">📲 שמירת האפליקציה במסך הבית</button>
      </div>
    </section>

    <section id="view-orders" class="hidden">
      <div class="card">
        <h2>ההזמנות שלי</h2>
        <div id="orders-list" class="stack"></div>
      </div>
    </section>
  </main>

  <!-- סרגל ניווט תחתון (אפליקציה) -->
  <nav class="bottom-nav" aria-label="ניווט ראשי">
    <button data-view="store" class="active"><span class="ico">🛍️</span>חנות</button>
    <button data-view="events"><span class="ico">📸</span>האירועים שלי</button>
    <button data-view="orders"><span class="ico">📦</span>הזמנות</button>
    <button data-open-cart><span class="ico">🛒</span>סל</button>
  </nav>

  <!-- סל קניות וקופה -->
  <div id="cart-bg" class="drawer-bg hidden"></div>
  <aside id="cart" class="drawer hidden" aria-label="סל קניות">
    <div class="row between"><h2 style="margin:0">הסל שלי</h2><button class="icon-btn" id="cart-close" aria-label="סגירה">✕</button></div>
    <div id="cart-items" class="stack" style="margin:12px 0"></div>
    <div id="cart-summary"></div>
    <form id="checkout" class="hidden" style="margin-top:16px">
      <h3>פרטי משלוח</h3>
      <div class="field"><label for="c-name">שם מלא</label><input id="c-name" required autocomplete="name"></div>
      <div class="field"><label for="c-phone">טלפון</label><input id="c-phone" required type="tel" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label for="c-email">אימייל (לקבלה)</label><input id="c-email" type="email" autocomplete="email"></div>
      <div class="field"><label for="c-city">עיר</label><input id="c-city" required list="cities" autocomplete="address-level2"><datalist id="cities"></datalist></div>
      <div class="field"><label for="c-address">כתובת</label><input id="c-address" required autocomplete="street-address"></div>
      <div class="field"><label for="c-notes">הערות להזמנה</label><textarea id="c-notes"></textarea></div>
      <button class="btn block" id="pay-btn">🔒 מעבר לתשלום מאובטח</button>
      <p class="muted small">התשלום מתבצע בדף מאובטח של חברת הסליקה. פרטי האשראי אינם נשמרים אצלנו.</p>
    </form>
  </aside>

  <!-- בחירת תמונה למוצר -->
  <div id="photo-modal" class="modal hidden">
    <div class="card">
      <div class="row between"><h2 style="margin:0">בחירת תמונה למוצר</h2><button class="icon-btn" data-close aria-label="סגירה">✕</button></div>
      <p class="muted">בחרו תמונה מהאירועים שלכם או העלו תמונה חדשה.</p>
      <div class="grid sm" id="my-photos"></div>
      <label class="btn soft" for="store-upload" style="margin-top:12px">⬆️ העלאת תמונה</label>
      <input type="file" id="store-upload" accept="image/*" class="hidden">
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
