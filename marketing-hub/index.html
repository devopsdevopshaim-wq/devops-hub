<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="hub/runtime.js"></script>
<title>פרסום ושיווק</title>
<script>
  (function () {
    var nativeFetch = window.fetch;
    window.fetch = function (input, init) {
      init = init || {};
      if (init.credentials === undefined) init.credentials = "include";
      return nativeFetch(input, init);
    };
  })();
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var href = a.getAttribute("href");
    if (href && href.length > 1) { e.preventDefault(); location.hash = href; }
  }, true);
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/tab-themes.css" />
<link rel="stylesheet" href="css/marketing.css" />
<style>
  .standalone-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 9px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line);
    font-family: var(--font-body); font-size: 0.78rem; color: var(--cream-dim);
  }
  .standalone-bar a { color: var(--brass-soft); text-decoration: none; }
  .standalone-bar a:hover { text-decoration: underline; }
</style>
</head>
<body class="theme-adpop">
<div class="standalone-bar">
  <span>פרסום ושיווק </span>
  <a href="../portfolio/">כל האתרים שלי ←</a>
</div>
<div class="shell">

  <header class="top-header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 20 L26 10 V38 L8 28 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M26 16 C34 16 40 20 40 24 C40 28 34 32 26 32" stroke="currentColor" stroke-width="2.2" fill="none"/>
        <path d="M12 28 L14 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>פרסום ושיווק</h1>
        <div class="tagline">קמפיין מלא ממותאם לעסק שלך — כותרות, טקסטים, קריאה-לפעולה ובריף חזותי</div>
      </div>
    </div>
  </header>

  <div class="mk-wrap">
    <form class="mk-form" id="mk-form">
      <div class="mk-row2">
        <label>שם העסק <input type="text" id="mk-business" required placeholder="לדוגמה: מגנטים קריספין"></label>
        <label>תחום <input type="text" id="mk-industry" placeholder="עיצוב מגנטים אישיים"></label>
      </div>
      <label>המוצר / ההצעה שמפרסמים <textarea id="mk-offer" rows="2" required placeholder="לדוגמה: מגנטים ממותגים בהזמנה אישית, מבצע 20% לקראת החגים"></textarea></label>
      <div class="mk-row3">
        <label>מטרה
          <select id="mk-goal">
            <option value="launch">השקת מוצר/מבצע</option>
            <option value="sale">מבצע/הנחה</option>
            <option value="awareness">חשיפת מותג</option>
            <option value="event">אירוע</option>
            <option value="loyalty">שימור לקוחות</option>
          </select>
        </label>
        <label>פלטפורמה
          <select id="mk-platform">
            <option value="facebook">פייסבוק</option>
            <option value="instagram">אינסטגרם</option>
            <option value="whatsapp">וואטסאפ / סטטוס</option>
            <option value="flyer">פלייר להדפסה</option>
            <option value="email">מייל שיווקי</option>
            <option value="google">מודעות גוגל</option>
          </select>
        </label>
        <label>טון <input type="text" id="mk-tone" placeholder="חם, מקצועי, דחוף…"></label>
      </div>
      <label>קהל יעד (אופציונלי) <input type="text" id="mk-audience" placeholder="לדוגמה: זוגות לפני חתונה, אזור המרכז"></label>
      <label>הערות נוספות (אופציונלי) <textarea id="mk-notes" rows="2"></textarea></label>
      <button class="btn primary" type="submit">✨ בנה קמפיין</button>
    </form>

    <div id="mk-result" hidden></div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="js/marketing.js"></script>
</body>
</html>
