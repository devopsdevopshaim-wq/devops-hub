<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>שכבות — הרפתקה ארכיאולוגית</title>
<meta name="description" content="משחק חפירות ארכיאולוגיות בדפדפן: חופרים שכבה אחרי שכבה בעכו, בקיסריה, בעיר דוד, במגידו ובמערות הכרמל, חושפים ממצאים אמיתיים מההיסטוריה של הארץ ובונים מוזיאון." />
<meta name="theme-color" content="#1a110a" />
<meta property="og:title" content="שכבות — הרפתקה ארכיאולוגית" />
<meta property="og:description" content="כל שכבה היא אלף שנה. מה אתם תגלו?" />
<link rel="icon" href="img/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Suez+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/game.css" />
</head>
<body data-screen="home">

<header class="topbar">
  <a class="brand" href="#" data-go="home" aria-label="שכבות, מסך הפתיחה"><img src="img/icon.svg" alt="" width="30" height="30" /><b>שכבות</b></a>
  <div class="stats">
    <div class="lvl" title="רמת חוקר"><span class="badge">⭐ <b id="lvl">1</b></span><div class="xp"><i id="xp-fill"></i></div></div>
    <span class="pill" title="מטבעות">🪙 <b id="coins">0</b></span>
    <span class="pill" title="קרעי מפת אוצר">🗺️ <b id="frags">0/3</b></span>
    <button class="icon-btn" id="snd" aria-label="צליל">🔊</button>
  </div>
</header>

<main>
  <!-- home -->
  <section class="screen" id="scr-home">
    <div class="hero">
      <div class="strata-bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="hero-finds" class="hero-finds" aria-hidden="true"></div>
      <div class="hero-text">
        <p class="kicker">הרפתקה ארכיאולוגית</p>
        <h1>שכבות</h1>
        <p class="tag">כל שכבה היא אלף שנה. מה אתם תגלו?</p>
        <button class="btn gold xl" id="play">להתחיל לחפור ⛏️</button>
        <ul class="how">
          <li><b>⛏️ חופרים</b> עם מכוש, כף ומברשת</li>
          <li><b>🏺 חושפים</b> ממצאים אמיתיים מ־8 תקופות</li>
          <li><b>🏛️ בונים</b> מוזיאון ומשדרגים את המשלחת</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- map -->
  <section class="screen" id="scr-map" hidden>
    <div class="daily" id="daily"></div>
    <div class="quests" id="quests"></div>
    <p class="maps-note" id="maps-note"></p>
    <h2 class="sec">אתרי חפירה</h2>
    <div class="sites" id="sites"></div>
  </section>

  <!-- dig -->
  <section class="screen" id="scr-dig" hidden>
    <div class="dig-head">
      <button class="icon-btn" id="dig-exit" aria-label="יציאה מהחפירה">✕</button>
      <div class="dig-title"><b id="dig-site"></b><small id="dig-place"></small></div>
      <div class="energy" title="אנרגיה"><span>⚡</span><div class="en-bar"><i id="en-fill"></i></div><b id="en-num">0</b></div>
      <div class="dig-stats"><span title="ממצאים">🏺 <b id="finds-num">0/0</b></span><span title="מטבעות בחפירה">🪙 <b id="dig-coins">0</b></span></div>
    </div>
    <div class="pit-wrap">
      <canvas id="pit" aria-label="אתר החפירה: הקישו על משבצת כדי לחפור"></canvas>
      <div class="tip" id="tip" role="status"></div>
    </div>
    <div class="tools">
      <div class="tool-row">
        <button class="tool" data-t="pick"><span class="ti">⛏️</span><span>מכוש</span><em class="dmg">💥<b id="t-pick-n">4</b></em></button>
        <button class="tool" data-t="trowel"><span class="ti">🔺</span><span>כף</span><em class="dmg">💥2</em></button>
        <button class="tool" data-t="brush"><span class="ti">🖌️</span><span>מברשת</span><em class="dmg">💥1</em></button>
        <button class="tool special" data-t="sonar"><span class="ti">🔊</span><span>סונאר</span><em class="cnt">×<b id="t-sonar-n">1</b></em></button>
        <button class="tool special" data-t="dyn"><span class="ti">🧨</span><span>פיצוץ</span><em class="cnt">×<b id="t-dyn-n">0</b></em></button>
      </div>
      <p class="tool-hint" id="tool-hint"></p>
    </div>
  </section>

  <!-- museum -->
  <section class="screen" id="scr-museum" hidden>
    <div class="mus-head" id="mus-head"></div>
    <div class="chips-row" id="mus-tabs"></div>
    <div class="mus-grid" id="mus-grid"></div>
    <div class="stats-row" id="stats"></div>
    <button class="link-btn" id="reset">איפוס התקדמות</button>
  </section>

  <!-- camp -->
  <section class="screen" id="scr-camp" hidden>
    <div class="camp-head"><div class="m-ico">🏕️</div><div><h2>המחנה</h2><p>משקיעים את המטבעות במשלחת: כלים טובים יותר, יותר כוח ויותר מזל.</p></div></div>
    <div class="ups" id="ups"></div>
  </section>
</main>

<nav class="tabbar" aria-label="ניווט">
  <button data-go="map"><span>🗺️</span>אתרים</button>
  <button data-go="museum"><span>🏛️</span>מוזיאון</button>
  <button data-go="camp"><span>🏕️</span>מחנה</button>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
