.f04-ai-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}
.f04-ai-skyimg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;opacity:.42}
.f04-ai-st{position:absolute;border-radius:50%;background:#fff}

.f04-ai-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}
.f04-ai-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f04-ai-tx{position:absolute;direction:rtl;text-align:right}
.f04-ai-eye{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.22em;color:#e0b25a;text-transform:uppercase;margin-bottom:22px;direction:ltr;display:block}
