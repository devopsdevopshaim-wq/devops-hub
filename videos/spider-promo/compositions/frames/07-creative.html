.f07-creative-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}

.f07-creative-st{position:absolute;border-radius:50%;background:#fff}

.f07-creative-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}

.f07-creative-tx{position:absolute;direction:rtl;text-align:right}
