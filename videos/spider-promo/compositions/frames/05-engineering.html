#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f1eefc;font-family:'Assistant',sans-serif}
.f05-engineering-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}
.f05-engineering-skyimg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;opacity:.42}
.f05-engineering-st{position:absolute;border-radius:50%;background:#fff}

.f05-engineering-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}
.f05-engineering-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f05-engineering-tx{position:absolute;direction:rtl;text-align:right}
.f05-engineering-eye{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.22em;color:#e0b25a;text-transform:uppercase;margin-bottom:22px;direction:ltr;display:block}
.f05-engineering-eyehe{font-family:'Assistant',sans-serif;font-weight:600;font-size:30px;letter-spacing:.06em;color:#e0b25a;margin-bottom:18px;display:block}
.f05-engineering-h1{font-family:'Bellefair',serif;font-weight:400;font-size:118px;line-height:1.08}
.f05-engineering-h2{font-family:'Bellefair',serif;font-weight:400;font-size:76px;line-height:1.12}
.f05-engineering-h3{font-family:'Bellefair',serif;font-weight:400;font-size:40px;line-height:1.1}
.f05-engineering-lede{font-family:'Assistant',sans-serif;font-weight:400;font-size:38px;color:#a9a4cc;margin-top:22px;line-height:1.35}
.f05-engineering-acc{color:#e0b25a}.f05-engineering-mint{color:#62dcb8}
.f05-engineering-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}
