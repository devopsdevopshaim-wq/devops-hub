#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f3ede2;font-family:'Assistant',sans-serif}
.f10-bg{position:absolute;inset:0;background:radial-gradient(85% 75% at 50% 42%,#1b160f 0%,#0d0b09 48%,#070608 100%)}
.f10-dust{position:absolute;border-radius:50%;background:#f2deac}
.f10-grain{position:absolute;left:-256px;top:-256px;width:2432px;height:1592px;background:url(assets/grain.png);opacity:.07;mix-blend-mode:overlay}
.f10-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 48%,rgba(0,0,0,.78) 100%)}
.f10-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f10-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .16em}
.f10-w{display:inline-block;white-space:pre}
.f10-hair{stroke:#d6b46e;stroke-width:1.4;fill:none}
.f10-beam{position:absolute;width:300px;height:2600px;left:50%;top:50%;margin:-1300px 0 0 -150px;background:linear-gradient(90deg,rgba(255,226,160,0),rgba(255,226,160,.13) 50%,rgba(255,226,160,0));mix-blend-mode:screen;transform-origin:50% 50%}
.f10-win{position:absolute;border-radius:14px;overflow:hidden;background:#0c0b0d;border:1px solid rgba(214,180,110,.45);box-shadow:0 60px 120px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.7)}
.f10-bar{position:absolute;left:0;right:0;top:0;height:44px;background:linear-gradient(#1a1816,#121012);border-bottom:1px solid rgba(214,180,110,.25);direction:ltr}
.f10-dots{position:absolute;left:18px;top:16px;width:60px;height:12px}
.f10-dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:#3a352e}
.f10-url{position:absolute;left:50%;top:9px;transform:translateX(-50%);height:26px;line-height:26px;padding:0 22px;border-radius:13px;background:#0a090b;border:1px solid rgba(214,180,110,.22);font-family:'JetBrains Mono',monospace;font-size:14px;color:#b9b0a0;white-space:nowrap}
.f10-url b{color:#f2deac;font-weight:500}
.f10-vp{position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden;background:#0c0b0d}
.f10-vp img{position:absolute;left:0;top:0;width:100%;display:block}
.f10-sheen{position:absolute;top:-30%;left:0;width:30%;height:160%;background:linear-gradient(100deg,rgba(255,240,210,0),rgba(255,240,210,.16),rgba(255,240,210,0));pointer-events:none}
