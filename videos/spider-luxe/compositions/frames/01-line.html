#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f3ede2;font-family:'Assistant',sans-serif}
.f01-bg{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 38%,#1a1610 0%,#0e0c0a 45%,#09080a 100%)}
.f01-dust{position:absolute;border-radius:50%;background:#f2deac}
.f01-grain{position:absolute;left:-256px;top:-256px;width:2432px;height:1592px;background:url(assets/grain.png);opacity:.06;mix-blend-mode:overlay}
.f01-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 50%,rgba(0,0,0,.72) 100%)}
.f01-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f01-tx{position:absolute;direction:ltr;text-align:left}
.f01-eye{display:block;font-family:'Michroma',sans-serif;font-size:19px;letter-spacing:.42em;color:#d6b46e;text-transform:uppercase;margin-bottom:30px}
.f01-h1{font-family:'Bellefair',serif;font-weight:400;font-size:96px;line-height:1.08;letter-spacing:-.005em}
.f01-h2{font-family:'Bellefair',serif;font-weight:400;font-size:74px;line-height:1.1}
.f01-lede{font-family:'Assistant',sans-serif;font-weight:400;font-size:32px;color:#8f887b;margin-top:30px;line-height:1.45;letter-spacing:.01em}
.f01-gold{color:#f2deac}
.f01-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .14em}
.f01-w{display:inline-block;white-space:pre}
.f01-rule{display:block;width:120px;height:1px;background:#d6b46e;margin-top:36px;transform-origin:0% 50%}
.f01-panel{position:absolute;overflow:visible}
.f01-glass{position:absolute;inset:0;border-radius:10px;overflow:hidden;border:1px solid rgba(214,180,110,.55);box-shadow:0 40px 90px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.6);background:#111;-webkit-box-reflect:below 14px linear-gradient(transparent 72%,rgba(255,255,255,.13))}
.f01-glass img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.f01-sheen{position:absolute;top:-20%;left:0;width:34%;height:140%;background:linear-gradient(100deg,rgba(255,240,210,0),rgba(255,240,210,.22),rgba(255,240,210,0));pointer-events:none}
.f01-cap{position:absolute;top:calc(100% + 22px);left:0;direction:ltr;font-family:'Michroma',sans-serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#8f887b;white-space:nowrap}
