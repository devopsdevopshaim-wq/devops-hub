#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f3ede2;font-family:'Assistant',sans-serif}
.f01-bg{position:absolute;inset:0;background:radial-gradient(85% 75% at 50% 42%,#1b160f 0%,#0d0b09 48%,#070608 100%)}
.f01-dust{position:absolute;border-radius:50%;background:#f2deac}
.f01-grain{position:absolute;left:-256px;top:-256px;width:2432px;height:1592px;background:url(assets/grain.png);opacity:.07;mix-blend-mode:overlay}
.f01-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 48%,rgba(0,0,0,.78) 100%)}
.f01-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f01-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .16em}
.f01-w{display:inline-block;white-space:pre}
.f01-hair{stroke:#d6b46e;stroke-width:1.4;fill:none}
.f01-beam{position:absolute;width:300px;height:2600px;left:50%;top:50%;margin:-1300px 0 0 -150px;background:linear-gradient(90deg,rgba(255,226,160,0),rgba(255,226,160,.13) 50%,rgba(255,226,160,0));mix-blend-mode:screen;transform-origin:50% 50%}
.f01-win{position:absolute;border-radius:14px;overflow:hidden;background:#0c0b0d;border:1px solid rgba(214,180,110,.45);box-shadow:0 60px 120px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.7)}
.f01-bar{position:absolute;left:0;right:0;top:0;height:44px;background:linear-gradient(#1a1816,#121012);border-bottom:1px solid rgba(214,180,110,.25);direction:ltr}
.f01-dots{position:absolute;left:18px;top:16px;width:60px;height:12px}
.f01-dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:#3a352e}
.f01-url{position:absolute;left:50%;top:9px;transform:translateX(-50%);height:26px;line-height:26px;padding:0 22px;border-radius:13px;background:#0a090b;border:1px solid rgba(214,180,110,.22);font-family:'JetBrains Mono',monospace;font-size:14px;color:#b9b0a0;white-space:nowrap}
.f01-url b{color:#f2deac;font-weight:500}
.f01-vp{position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden;background:#0c0b0d}
.f01-vp img{position:absolute;left:0;top:0;width:100%;display:block}
.f01-sheen{position:absolute;top:-30%;left:0;width:30%;height:160%;background:linear-gradient(100deg,rgba(255,240,210,0),rgba(255,240,210,.16),rgba(255,240,210,0));pointer-events:none}

.f01-big{position:absolute;left:0;right:0;text-align:center;direction:ltr;font-family:'Bellefair',serif;color:#f3ede2;line-height:1}
