#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f1eefc;font-family:'Assistant',sans-serif}
.f03-count-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}
.f03-count-skyimg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;opacity:.42}
.f03-count-st{position:absolute;border-radius:50%;background:#fff}
.f03-count-grain{position:absolute;left:-256px;top:-256px;width:2432px;height:1592px;background:url(assets/grain.png);opacity:.07;mix-blend-mode:overlay}
.f03-count-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}
.f03-count-ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.f03-count-tx{position:absolute;direction:ltr;text-align:left}
.f03-count-eye{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.22em;color:#e0b25a;text-transform:uppercase;margin-bottom:22px;direction:ltr;display:block}
.f03-count-eyehe{font-family:'Assistant',sans-serif;font-weight:600;font-size:30px;letter-spacing:.06em;color:#e0b25a;margin-bottom:18px;display:block}
.f03-count-h1{font-family:'Bellefair',serif;font-weight:400;font-size:118px;line-height:1.08}
.f03-count-h2{font-family:'Bellefair',serif;font-weight:400;font-size:76px;line-height:1.12}
.f03-count-h3{font-family:'Bellefair',serif;font-weight:400;font-size:40px;line-height:1.1}
.f03-count-lede{font-family:'Assistant',sans-serif;font-weight:400;font-size:38px;color:#a9a4cc;margin-top:22px;line-height:1.35}
.f03-count-acc{color:#e0b25a}.f03-count-mint{color:#62dcb8}
.f03-count-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}
.f03-count-w{display:inline-block;white-space:pre}
.f03-count-ul{display:block;height:3px;background:linear-gradient(90deg,rgba(224,178,90,0),#e0b25a 30%,#f3d596);margin-top:14px;transform-origin:0% 50%}
.f03-count-shot{position:absolute;border-radius:16px;overflow:hidden;border:1px solid rgba(241,238,252,.22);box-shadow:0 26px 70px rgba(0,0,0,.55);background:#17143a}
.f03-count-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
