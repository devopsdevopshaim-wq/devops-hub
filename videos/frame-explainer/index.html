<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fbf6ee;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-moment"
        class="scene"
        data-composition-id="01-moment"
        data-composition-src="compositions/frames/01-moment.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-promise"
        class="scene"
        data-composition-id="02-promise"
        data-composition-src="compositions/frames/02-promise.html"
        data-start="6"
        data-duration="6.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-date"
        class="scene"
        data-composition-id="03-date"
        data-composition-src="compositions/frames/03-date.html"
        data-start="12"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-design"
        class="scene"
        data-composition-id="04-design"
        data-composition-src="compositions/frames/04-design.html"
        data-start="20"
        data-duration="8.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-day"
        class="scene"
        data-composition-id="05-day"
        data-composition-src="compositions/frames/05-day.html"
        data-start="28"
        data-duration="8.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-styles"
        class="scene"
        data-composition-id="06-styles"
        data-composition-src="compositions/frames/06-styles.html"
        data-start="36"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-home"
        class="scene"
        data-composition-id="07-home"
        data-composition-src="compositions/frames/07-home.html"
        data-start="45"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="53"
        data-duration="7"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music.m4a"
        data-start="0"
        data-duration="60"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-moment", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-promise", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-02-promise", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-03-date", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 12);
        tl.to("#el-03-date", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-04-design", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-04-design", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.fromTo("#el-05-day", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.to("#el-05-day", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 36);
        tl.fromTo("#el-06-styles", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 36);
        tl.to("#el-06-styles", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.fromTo("#el-07-home", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.to("#el-07-home", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 53);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 53);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
