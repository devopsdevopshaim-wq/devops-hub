  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="06-styles"]');
      var q = function (sel) { return root.querySelector(sel); };
      var BEAT = 60 / 104; // 0.577s
      var TOTAL = 9;

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.6s): anchor lands and pins ----
      tl.fromTo(q('#s06-bloom'), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'power2.out' }, 0);
      tl.fromTo(q('#s06-ember'), { opacity: 0 }, { opacity: 1, duration: 1.6, ease: 'power1.out' }, 0.2);
      tl.fromTo(q('#s06-card'), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.2)' }, 0);
      tl.fromTo(q('#s06-head'), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.3);
      tl.fromTo(q('#s06-divider'), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: 'power2.inOut' }, 0.6);
      tl.fromTo(q('#s06-tag-before'), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 1.0);
      tl.fromTo(q('#s06-rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, 1.0);

      // ---- Scene 2 (1.6–7.0s): the styled half hard-cuts through 8 styles on the beat ----
      // Discrete state schedule (reverse search). 8 styles from beat 3 → beat 10, hold, then
      // cut back to comic for the Scene 3 hold.
      var STYLES = [
        { id: 'comic',    label: 'קומיקס' },
        { id: 'manga',    label: 'מנגה' },
        { id: 'pop',      label: 'פופ־ארט' },
        { id: 'cartoon',  label: 'סרט מצויר' },
        { id: 'mosaic',   label: 'פסיפס' },
        { id: 'neon',     label: 'ניאון' },
        { id: 'sketch',   label: 'סקיצה' },
        { id: 'oldphoto', label: 'תמונה ישנה' }
      ];
      var SEQ = [{ t: 0, s: -1 }];
      for (var i = 0; i < STYLES.length; i++) SEQ.push({ t: BEAT * (3 + i), s: i });
      var T_BACK = BEAT * 12; // ~6.92s
      SEQ.push({ t: T_BACK, s: 0 });

      var imgs = STYLES.map(function (st) { return q('#s06-img-' + st.id); });
      var chip = q('#s06-chip');
      var tagAfter = q('#s06-tag-after');
      var chipRow = q('#s06-chiprow');

      function stateAt(time) {
        for (var k = SEQ.length - 1; k >= 0; k--) { if (time >= SEQ[k].t) return SEQ[k].s; }
        return -1;
      }
      var lastS = null;
      function render(time) {
        var s = stateAt(time);
        if (s === lastS) return;
        lastS = s;
        for (var j = 0; j < imgs.length; j++) imgs[j].style.visibility = (j === s) ? 'visible' : 'hidden';
        var on = s >= 0;
        chipRow.style.visibility = on ? 'visible' : 'hidden';
        tagAfter.style.visibility = on ? 'visible' : 'hidden';
        chip.textContent = on ? STYLES[s].label : STYLES[0].label;
      }
      var driver = { t: 0 };
      render(0);
      tl.to(driver, { t: TOTAL, duration: TOTAL, ease: 'none', onUpdate: function () { render(driver.t); } }, 0);

      // label "slap" on every cut (transform only on the chip; the row stays put)
      for (var m = 1; m < SEQ.length; m++) {
        tl.fromTo(chip, { scale: 1.12 }, { scale: 1, duration: 0.22, ease: 'power3.out', immediateRender: false }, SEQ[m].t);
      }

      // counter "22+ סגנונות" under the headline — counts up across the cycle
      var num = q('#s06-num');
      var cnt = { v: 1 };
      tl.fromTo(q('#s06-count'), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, BEAT * 4);
      tl.fromTo(cnt, { v: 1 }, {
        v: 22, duration: BEAT * 6, ease: 'power1.inOut',
        onUpdate: function () { num.textContent = Math.round(cnt.v) + '+'; }
      }, BEAT * 4);

      // ---- Scene 3 (7.0–9.0s): payoff line in gold, hold on the comic split ----
      tl.fromTo(q('#s06-line'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' }, 7.0);

      // pad to full duration (static hold — no exit)
      tl.set({}, {}, TOTAL);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-styles"] = tl;
    })();
