#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f1eefc;font-family:'Assistant',sans-serif}
.f09-pipeline-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}
.f09-pipeline-skyimg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;opacity:.42}
.f09-pipeline-st{position:absolute;border-radius:50%;background:#fff}
.f09-pipeline-grain{position:absolute;left:-256px;top:-256px;width:1592px;height:1862px;background:url(assets/grain.png);opacity:.07;mix-blend-mode:overlay}
.f09-pipeline-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}
.f09-pipeline-ov{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible}
.f09-pipeline-tx{position:absolute;direction:rtl;text-align:right}
.f09-pipeline-eye{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;letter-spacing:.22em;color:#e0b25a;text-transform:uppercase;margin-bottom:18px;direction:ltr;display:block}
.f09-pipeline-eyehe{font-family:'Assistant',sans-serif;font-weight:600;font-size:25px;letter-spacing:.06em;color:#e0b25a;margin-bottom:15px;display:block}
.f09-pipeline-h1{font-family:'Bellefair',serif;font-weight:400;font-size:101px;line-height:1.08}
.f09-pipeline-h2{font-family:'Bellefair',serif;font-weight:400;font-size:65px;line-height:1.12}
.f09-pipeline-h3{font-family:'Bellefair',serif;font-weight:400;font-size:34px;line-height:1.1}
.f09-pipeline-lede{font-family:'Assistant',sans-serif;font-weight:400;font-size:32px;color:#a9a4cc;margin-top:18px;line-height:1.35}
.f09-pipeline-acc{color:#e0b25a}.f09-pipeline-mint{color:#62dcb8}
.f09-pipeline-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}
.f09-pipeline-w{display:inline-block;white-space:pre}
.f09-pipeline-ul{display:block;height:3px;background:linear-gradient(90deg,rgba(224,178,90,0),#e0b25a 30%,#f3d596);margin-top:12px;transform-origin:100% 50%}
.f09-pipeline-shot{position:absolute;border-radius:16px;overflow:hidden;border:1px solid rgba(241,238,252,.22);box-shadow:0 26px 70px rgba(0,0,0,.55);background:#17143a}
.f09-pipeline-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
