#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;color:#f1eefc;font-family:'Assistant',sans-serif}
.f11-cta-bg{position:absolute;inset:0;background:radial-gradient(120% 95% at 68% -5%,#2a2366 0%,#17143a 40%,#0f0d24 78%)}
.f11-cta-skyimg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;opacity:.42}
.f11-cta-st{position:absolute;border-radius:50%;background:#fff}
.f11-cta-grain{position:absolute;left:-256px;top:-256px;width:1592px;height:1862px;background:url(assets/grain.png);opacity:.07;mix-blend-mode:overlay}
.f11-cta-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,4,16,.55) 100%)}
.f11-cta-ov{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible}
.f11-cta-tx{position:absolute;direction:rtl;text-align:right}
.f11-cta-eye{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;letter-spacing:.22em;color:#e0b25a;text-transform:uppercase;margin-bottom:18px;direction:ltr;display:block}

.f11-cta-h1{font-family:'Bellefair',serif;font-weight:400;font-size:101px;line-height:1.08}
.f11-cta-h2{font-family:'Bellefair',serif;font-weight:400;font-size:65px;line-height:1.12}

.f11-cta-lede{font-family:'Assistant',sans-serif;font-weight:400;font-size:32px;color:#a9a4cc;margin-top:18px;line-height:1.35}
.f11-cta-acc{color:#e0b25a}.f11-cta-mint{color:#62dcb8}
.f11-cta-m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}
.f11-cta-w{display:inline-block;white-space:pre}
