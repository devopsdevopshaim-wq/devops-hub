<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f2ede3;
        --ink: #1c1a17;
        --muted: #6b645a;
        --accent: #c8431a;
        --term: #1c1a17;
        --term-text: #f2ede3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        font-family: "Liberation Sans", "DejaVu Sans", sans-serif;
        color: var(--ink);
      }
      #main-clip {
        position: absolute;
        inset: 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 120px 180px;
        gap: 28px;
        visibility: hidden;
      }
      .rule {
        position: absolute;
        left: 180px;
        bottom: 120px;
        width: 1560px;
        height: 6px;
        background: var(--accent);
        transform-origin: left center;
      }
      .eyebrow {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .hero {
        font-size: 220px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.9;
      }
      .sub {
        font-size: 56px;
        color: var(--muted);
      }
      .line {
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .word {
        display: inline-block;
        margin-right: 0.22em;
      }
      .em {
        color: var(--accent);
      }
      .stat-row {
        display: flex;
        align-items: baseline;
        gap: 40px;
      }
      #count {
        font-size: 300px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .terminal {
        background: var(--term);
        color: var(--term-text);
        font-family: "DejaVu Sans Mono", "Liberation Mono", monospace;
        font-size: 64px;
        padding: 56px 72px;
        border-radius: 20px;
        width: 1560px;
      }
      .prompt {
        color: var(--accent);
      }
      .caret {
        display: inline-block;
        width: 0.6em;
        height: 1em;
        margin-left: 4px;
        vertical-align: -0.12em;
        background: var(--term-text);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="main-clip" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <!-- Scene 1: hook -->
        <div id="s1" class="scene">
          <div id="s1-eyebrow" class="eyebrow">Repository</div>
          <div id="s1-hero" class="hero">devops-hub</div>
          <div id="s1-sub" class="sub">built on webhint</div>
        </div>

        <!-- Scene 2: build -->
        <div id="s2" class="scene">
          <div class="eyebrow">What it does</div>
          <div class="line">
            <span class="word w2">Lint</span><span class="word w2">your</span><span class="word w2">site</span><span class="word w2">for</span>
          </div>
          <div class="line">
            <span class="word w2b em">accessibility,</span><span class="word w2b em">speed</span><span class="word w2b">&amp;</span><span class="word w2b em">compatibility.</span>
          </div>
        </div>

        <!-- Scene 3: punch -->
        <div id="s3" class="scene" style="gap: 56px">
          <div class="eyebrow">Monorepo</div>
          <div class="stat-row">
            <div id="count">0</div>
            <div id="s3-label" class="stat-label">packages</div>
          </div>
        </div>

        <!-- Scene 4: resolve -->
        <div id="s4" class="scene">
          <div class="eyebrow">Try it</div>
          <div id="term" class="terminal">
            <span class="prompt">$ </span><span id="typed"></span><span id="caret" class="caret"></span>
          </div>
        </div>

        <div id="rule" class="rule"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const show = (sel, at) => tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, at);
      const hide = (sel, at) => tl.to(sel, { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, at);

      // Rule sweeps in once and stays as the anchor
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.1);

      // Scene 1 — slam title (0 – 2.6)
      show("#s1", 0);
      tl.fromTo("#s1-eyebrow", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo("#s1-hero", { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: "expo.out" }, 0.3);
      tl.fromTo("#s1-sub", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.85);
      hide("#s1", 2.4);

      // Scene 2 — word reveal (2.65 – 5.4)
      show("#s2", 2.65);
      tl.fromTo(".w2", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.09 }, 2.7);
      tl.fromTo(".w2b", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.16 }, 3.25);
      hide("#s2", 5.2);

      // Scene 3 — count-up (5.45 – 7.6)
      show("#s3", 5.45);
      const counter = { v: 0 };
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 97,
          immediateRender: false,
          duration: 1.2,
          ease: "power3.out",
          onUpdate: () => {
            document.getElementById("count").textContent = Math.round(counter.v);
          },
        },
        5.5,
      );
      tl.fromTo("#count", { scale: 0.85 }, { scale: 1, duration: 1.2, ease: "power3.out", transformOrigin: "left bottom" }, 5.5);
      tl.fromTo("#s3-label", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.1);
      hide("#s3", 7.4);

      // Scene 4 — typewriter command, final hold (7.65 – 10)
      show("#s4", 7.65);
      tl.fromTo("#term", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.7);
      const cmd = "npx hint https://example.com";
      const typer = { n: 0 };
      tl.fromTo(
        typer,
        { n: 0 },
        {
          n: cmd.length,
          immediateRender: false,
          duration: 1.1,
          ease: "none",
          onUpdate: () => {
            document.getElementById("typed").textContent = cmd.slice(0, Math.round(typer.n));
          },
        },
        8.1,
      );
      // Caret blink during the hold (deterministic keyframes)
      tl.to("#caret", { autoAlpha: 0, duration: 0.01 }, 9.35);
      tl.to("#caret", { autoAlpha: 1, duration: 0.01 }, 9.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
