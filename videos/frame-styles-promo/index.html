<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fbf6ee;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-one-photo"
        class="scene"
        data-composition-id="01-one-photo"
        data-composition-src="compositions/frames/01-one-photo.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-brand"
        class="scene"
        data-composition-id="02-brand"
        data-composition-src="compositions/frames/02-brand.html"
        data-start="4"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-watch-it-change"
        class="scene"
        data-composition-id="03-watch-it-change"
        data-composition-src="compositions/frames/03-watch-it-change.html"
        data-start="7.5"
        data-duration="7.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-wall-of-styles"
        class="scene"
        data-composition-id="04-wall-of-styles"
        data-composition-src="compositions/frames/04-wall-of-styles.html"
        data-start="14.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-on-every-magnet"
        class="scene"
        data-composition-id="05-on-every-magnet"
        data-composition-src="compositions/frames/05-on-every-magnet.html"
        data-start="20.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music.m4a"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-one-photo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-brand", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-03-watch-it-change", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14.5);
        tl.fromTo("#el-04-wall-of-styles", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14.5);
        tl.to("#el-04-wall-of-styles", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.fromTo("#el-05-on-every-magnet", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.to("#el-05-on-every-magnet", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
