  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="04-wall-of-styles"]');
      const q = (sel) => Array.prototype.slice.call(root.querySelectorAll(sel));

      // Scene 1 (0.0–0.8s) — headline per-word reveal (DOM order = RTL reading order)
      tl.fromTo(
        q(".w04-word"),
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.14 },
        0.05
      );
      tl.fromTo(
        root.querySelector("#w04-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.inOut" },
        0.3
      );

      // Scene 2 (0.8–4.0s) — staggered self-assembling wall, right→left, row by row.
      // Each tile rises a short distance straight into its own slot; its label chip follows.
      const tiles = q(".w04-tile");
      const START = 0.8;
      const GAP = 0.22;
      tiles.forEach((tile, i) => {
        const t0 = START + i * GAP;
        tl.fromTo(
          tile,
          { opacity: 0, y: 36 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          t0
        );
        tl.fromTo(
          tile.querySelector(".w04-chip"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          t0 + 0.14
        );
      });

      // Macro camera — slow, faint push-in underneath the whole shot
      tl.fromTo(
        root.querySelector("#w04-camera"),
        { scale: 1 },
        { scale: 1.015, duration: 5.2, ease: "none" },
        0.8
      );

      // Scene 3 (4.0–6.0s) — select ניאון: gold ring snaps, one press, lift (no overshoot)
      const SEL = 4.02; // ≈ 7.5 beats @112bpm
      const neon = root.querySelector("#w04-neon");
      const PRESS_DUR = 0.12;
      tl.fromTo(
        root.querySelector("#w04-ring"),
        { opacity: 0, scale: 1.07 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" },
        SEL
      );
      // press (linear-ish compression)
      tl.fromTo(
        neon,
        { scale: 1 },
        { scale: 0.96, duration: PRESS_DUR, ease: "power1.in", immediateRender: false },
        SEL
      );
      // release → lift slightly, eased without overshoot (adjacent = state continuity)
      tl.to(
        neon,
        { scale: 1.05, y: -10, duration: 0.6, ease: "power2.out" },
        SEL + PRESS_DUR
      );

      // Depth-of-field: the other 11 tiles defocus lightly + dim to ~55%
      q(".w04-tile:not(.w04-focal)").forEach((tile) => {
        tl.to(
          tile,
          { "--dof": "3px", opacity: 0.55, duration: 0.7, ease: "power2.inOut" },
          SEL
        );
      });

      // hold to end (6s)
      tl.set({}, {}, 6);

      window.__timelines["04-wall-of-styles"] = tl;
