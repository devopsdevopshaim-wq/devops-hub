    (function () {
      var ID = "01-one-photo";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var $ = function (s) { return root.querySelector(s); };
      var byId = function (id) { return root.querySelector('[id="' + ID + '-' + id + '"]'); };

      var BEAT = 60 / 112;            // 0.536s — music bed grid
      var TOTAL = 4;
      var tl = gsap.timeline({ paused: true });

      var card = byId("card");
      var cardScale = byId("card-scale");
      var w1 = byId("w1");
      var w2 = byId("w2");
      var rule = byId("rule");
      var label = byId("label");
      var sun = byId("sun");
      var imgs = {
        original: byId("img-original"),
        comic: byId("img-comic"),
        pop: byId("img-pop"),
        manga: byId("img-manga")
      };

      // ---- Scene 1 (0.0–1.4s): card rises + fades in (tilted), per-word staggered headline reveal
      tl.fromTo(card,
        { opacity: 0, y: 70, rotation: -2.5 },
        { opacity: 1, y: 0, rotation: -2.5, duration: 0.9, ease: "power3.out" }, 0);
      // slow push underneath the whole shot (camera feel, card stays put)
      tl.fromTo(cardScale, { scale: 1.0 }, { scale: 1.035, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo(sun, { scale: 0.94, opacity: 0.85 }, { scale: 1.04, opacity: 1, duration: TOTAL, ease: "sine.inOut" }, 0);

      // per-word staggered fade/blur rise (RTL: first word on the top line)
      tl.fromTo(w1,
        { opacity: 0, y: 40, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.2);
      tl.fromTo(w2,
        { opacity: 0, y: 40, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, BEAT + 0.1);
      // hairline drawn right→left under the headline
      tl.fromTo(rule,
        { scaleX: 0, transformOrigin: "100% 50%" },
        { scaleX: 1, transformOrigin: "100% 50%", duration: 0.7, ease: "power2.inOut" }, 2 * BEAT);

      // ---- Scene 2 (1.4–2.9s): in-place hard-cut token swap + card flashes one style per beat
      // ---- Scene 3 (2.9–4.0s): card settles back on comic; micro-label fades in; hold
      // Sparse state schedule (discrete-text-sequence / dynamic-content-sequencing): each state
      // holds from its t until the next. Instant swaps, DOM written only on state change.
      var SEQUENCE = [
        { t: 0,        w1: "תמונה", w2: "אחת.",     img: "original" },
        { t: 3 * BEAT, w1: "עשרות", w2: "סגנונות.", img: "comic" },   // 1.607s
        { t: 4 * BEAT, w1: "עשרות", w2: "סגנונות.", img: "pop" },     // 2.143s
        { t: 5 * BEAT, w1: "עשרות", w2: "סגנונות.", img: "manga" },   // 2.679s
        { t: 6 * BEAT, w1: "עשרות", w2: "סגנונות.", img: "comic" }    // 3.214s settle
      ];
      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return i;
        }
        return 0;
      }
      var last = -1;
      function render(i) {
        if (i === last) return;
        var s = SEQUENCE[i];
        w1.textContent = s.w1;
        w2.textContent = s.w2;
        for (var k in imgs) imgs[k].style.opacity = (k === s.img) ? "1" : "0";
        last = i;
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: TOTAL,
        duration: TOTAL,
        ease: "none",
        onUpdate: function () { render(stateAt(driver.t)); }
      }, 0);

      // micro-label lands with the settle beat, then the frame holds still
      tl.fromTo(label,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 6 * BEAT);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
